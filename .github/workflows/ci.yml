name: CI

on:
  push:
  pull_request:

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM development files
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev ninja-build
      - name: Configure
        run: cmake -S . -B build-tests -G Ninja -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-tests --parallel
      - name: Test
        run: ctest --test-dir build-tests --output-on-failure

  platform-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            suffix: ""
          - os: windows-2025
            name: windows-x86_64
            suffix: .exe
          - os: macos-15
            name: macos-x86_64
            suffix: ""
          - os: macos-15-arm64
            name: macos-arm64
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM development files (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev ninja-build
          echo "LLVM_DIR=$(llvm-config --cmakedir)" >> "$GITHUB_ENV"

      - name: Select LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
          echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Select LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LLVM_DIR=C:\Program Files\LLVM\lib\cmake\llvm" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DBUILD_TESTING=OFF
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          "-DLLVM_DIR=$LLVM_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Native compiler and Longbow smoke test
        shell: bash
        run: >-
          cmake
          "-DFLECHA_COMPILER=$PWD/build/flecha${{ matrix.suffix }}"
          "-DLONGBOW=$PWD/build/longbow${{ matrix.suffix }}"
          "-DSOURCE_ROOT=$PWD"
          "-DOUTPUT_ROOT=$PWD/build/release-smoke"
          "-DEXECUTABLE_SUFFIX=${{ matrix.suffix }}"
          -P cmake/release_smoke.cmake

      - name: Package
        run: cmake --build build --target package

      - name: Verify installed layout
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/build/stage"
          cmake \
            "-DFLECHA_COMPILER=$PWD/build/stage/bin/flecha${{ matrix.suffix }}" \
            "-DLONGBOW=$PWD/build/stage/bin/longbow${{ matrix.suffix }}" \
            "-DSOURCE_ROOT=$PWD" \
            "-DOUTPUT_ROOT=$PWD/build/installed-smoke" \
            "-DEXECUTABLE_SUFFIX=${{ matrix.suffix }}" \
            -P cmake/release_smoke.cmake

      - uses: actions/upload-artifact@v4
        with:
          name: flecha-${{ matrix.name }}
          path: |
            build/flecha-*.tar.gz
            build/flecha-*.zip
          if-no-files-found: error
