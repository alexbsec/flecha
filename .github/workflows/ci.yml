name: Pull request validation

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contribution-policy:
    name: Contributor fork policy
    runs-on: ubuntu-24.04
    steps:
      - name: Require pull requests to originate from a fork
        if: github.event_name == 'pull_request'
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]; then
            case "$AUTHOR_ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *)
                echo "Contributor pull requests must originate from a fork." >&2
                echo "See CONTRIBUTING.md for the required workflow." >&2
                exit 1
                ;;
            esac
          fi

  linux-tests:
    name: Linux tests and editor checks
    needs: contribution-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev ninja-build neovim

      - name: Configure
        run: cmake -S . -B build-tests -G Ninja -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-tests --parallel

      - name: Run compiler and runtime tests
        run: ctest --test-dir build-tests --output-on-failure

      - name: Run Neovim syntax tests
        run: make test-neovim

  sanitizers:
    name: AddressSanitizer and UBSan
    needs: contribution-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev ninja-build

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitizers -G Ninja
          -DBUILD_TESTING=ON
          -DFLECHA_ENABLE_SANITIZERS=ON

      - name: Build sanitizer targets
        run: cmake --build build-sanitizers --parallel

      - name: Run sanitized unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: build-sanitizers/src/tests/test_flecha

      - name: Run sanitized native smoke tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build-sanitizers --output-on-failure
          -R '^NativeSemanticTests\.(ControlFlowDefiniteAssignment|ConstDeclarations|UnsafePointers|CheckedReferences|FixedArrays|Iteration|CheckedSlices|Defer|Tuples|ErrorValues|Structures|RawAllocation)$'

  platform-build:
    name: Build and package (${{ matrix.name }})
    needs: contribution-policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            suffix: ""
          - os: windows-2025
            name: windows-x86_64
            suffix: .exe
          - os: macos-15-intel
            name: macos-x86_64
            suffix: ""
          - os: macos-15
            name: macos-arm64
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM development files (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-llvm

      - name: Install LLVM development files (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev ninja-build
          echo "LLVM_DIR=$(llvm-config --cmakedir)" >> "$GITHUB_ENV"

      - name: Select LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
          echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Select LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64'
          $cmakePrefix = $prefix -replace '\\', '/'
          if (!(Test-Path "$prefix\lib\cmake\llvm\LLVMConfig.cmake")) {
            throw 'MSYS2 LLVM development files were not installed'
          }
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LLVM_DIR=$cmakePrefix/lib/cmake/llvm" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FLECHA_C_COMPILER=$cmakePrefix/bin/clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FLECHA_CXX_COMPILER=$cmakePrefix/bin/clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure release build
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DBUILD_TESTING=OFF
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=${FLECHA_C_COMPILER:-clang}"
          "-DCMAKE_CXX_COMPILER=${FLECHA_CXX_COMPILER:-clang++}"
          "-DLLVM_DIR=$LLVM_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Native compiler and Longbow smoke test
        shell: bash
        run: >-
          cmake
          "-DFLECHA_COMPILER=$PWD/build/flecha${{ matrix.suffix }}"
          "-DLONGBOW=$PWD/build/longbow${{ matrix.suffix }}"
          "-DSOURCE_ROOT=$PWD"
          "-DOUTPUT_ROOT=$PWD/build/release-smoke"
          "-DEXECUTABLE_SUFFIX=${{ matrix.suffix }}"
          -P cmake/release_smoke.cmake

      - name: Build release archives
        run: cmake --build build --target package

      - name: Verify installed layout
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/build/stage"
          cmake \
            "-DFLECHA_COMPILER=$PWD/build/stage/bin/flecha${{ matrix.suffix }}" \
            "-DLONGBOW=$PWD/build/stage/bin/longbow${{ matrix.suffix }}" \
            "-DSOURCE_ROOT=$PWD" \
            "-DOUTPUT_ROOT=$PWD/build/installed-smoke" \
            "-DEXECUTABLE_SUFFIX=${{ matrix.suffix }}" \
            -P cmake/release_smoke.cmake
